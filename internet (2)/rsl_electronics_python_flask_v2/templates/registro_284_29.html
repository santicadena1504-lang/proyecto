<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSL Electronics - Registro</title>
  <style>
    body {font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;margin:0;padding:0;background:linear-gradient(135deg,#6c07af,#39255e,#2e6fba);display:flex;justify-content:center;align-items:center;min-height:100vh;color:#333;flex-direction:column;}
    .contenedor {background:rgba(255,255,255,0.95);padding:30px;border-radius:12px;box-shadow:0px 6px 20px rgba(0,0,0,0.3);width:400px;max-width:90%;}
    .contenedor img {height:80px;display:block;margin:0 auto 15px;}
    h2 {text-align:center;color:#0d2a4d;margin-bottom:20px;}
    label {font-weight:bold;display:block;margin-top:10px;color:#0d2a4d;}
    input {width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px;font-size:14px;box-sizing:border-box;}
    button {margin-top:20px;width:100%;padding:12px;background:#0d2a4d;color:white;font-weight:bold;border:none;border-radius:6px;cursor:pointer;transition:background 0.3s;}
    button:hover {background:#123765;}
    p {text-align:center;margin-top:15px;font-size:14px;}
    a {color:#0d2a4d;font-weight:bold;text-decoration:none;}
    a:hover {text-decoration:underline;}

.flash{max-width:900px;margin:15px auto;padding:12px 16px;border-radius:10px;font-weight:bold;}
.flash.success{background:#d1fae5;color:#065f46;}
.flash.error{background:#fee2e2;color:#991b1b;}
.flash.info{background:#dbeafe;color:#1e3a8a;}
.admin-panel{max-width:1200px;margin:25px auto;background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);border-radius:14px;padding:20px;color:#fff;}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.admin-grid input,.admin-grid textarea{width:100%;padding:10px;border-radius:8px;border:none;}
.admin-grid textarea{min-height:90px;}
.btn-soft{display:inline-block;padding:10px 14px;background:#ffd700;color:#0d2a4d;border:none;border-radius:8px;text-decoration:none;font-weight:bold;cursor:pointer;}
.btn-danger{background:#d43f5e;color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;}
.btn-warning{background:#f59e0b;color:#fff;border:none;border-radius:8px;padding:8px 12px;text-decoration:none;cursor:pointer;}
.inline-form{display:inline;}
.top-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
.table-wrap{overflow-x:auto;}
.rsl-table{width:100%;border-collapse:collapse;background:#fff;color:#111827;border-radius:12px;overflow:hidden;}
.rsl-table th,.rsl-table td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;}

  </style>
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endif %}{% endwith %}
  <div class="contenedor">
    <img src="{{ url_for('static', filename='asets (2)/imagenes (2)/logo.png') }}" alt="Logo RSL">
    <h2>Crear Cuenta</h2>
    <form method="post">
      <label for="nombre">Nombre completo</label><input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>
      <label for="edad">Edad</label><input type="number" id="edad" name="edad" placeholder="Ej: 25" min="1" max="120" required>
      <label for="fecha_nacimiento">Fecha de nacimiento</label><input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
      <label for="correo">Correo electrónico</label><input type="email" id="correo" name="correo" placeholder="ejemplo@email.com" required>
      <label for="usuario">Usuario</label><input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required>
      <label for="password">Contraseña</label><input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      <label for="confirmar">Confirmar contraseña</label><input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" minlength="6" required>
      <label for="telefono">Teléfono</label><input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>
      <label for="direccion">Dirección</label><input type="text" id="direccion" name="direccion" placeholder="Ej: Calle 123 #45-67" required>
      <button type="submit">Registrarse</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="{{ url_for('inicio') }}">Inicia sesión</a></p>
  </div>
</body>
</html>
